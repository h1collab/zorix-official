<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorix Search</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .search-container { text-align: center; width: 100%; max-width: 600px; padding: 20px; }
        h1 { font-size: 3.5rem; color: #00ffcc; margin-bottom: 20px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        .search-box { display: flex; background: #1e1e1e; border: 2px solid #333; border-radius: 30px; padding: 5px 15px; transition: all 0.3s; }
        .search-box:focus-within { border-color: #00ffcc; box-shadow: 0 0 15px rgba(0,255,204,0.2); }
        input { flex: 1; background: transparent; border: none; color: white; font-size: 1.1rem; padding: 10px; outline: none; }
        button { background: transparent; border: none; color: #00ffcc; font-size: 1.2rem; cursor: pointer; padding: 0 10px; }
        #results { width: 100%; max-width: 800px; margin-top: 30px; padding: 0 20px; display: none; }
        .result-item { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #00ffcc; }
        .result-item a { color: #00ffcc; font-size: 1.2rem; text-decoration: none; font-weight: bold; }
        .result-item a:hover { text-decoration: underline; }
        .result-item p { color: #aaa; font-size: 0.95rem; margin: 5px 0 0 0; line-height: 1.4; }
        .searching { color: #aaa; font-style: italic; text-align: center; }
    </style>
</head>
<body>

    <div class="search-container" id="main-container">
        <h1>Zorix</h1>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="探索未知的世界..." onkeydown="if(event.key==='Enter') doSearch()">
            <button onclick="doSearch()">🔍</button>
        </div>
    </div>

    <div id="results"></div>

    <script src="script.js"></script>
</body>
</html>
