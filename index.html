<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elimina account | Zorix</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #0f172a;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.12), transparent 42%),
        #f8fafc;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 36px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 28px;
      box-shadow:
        0 24px 60px rgba(15, 23, 42, 0.12),
        0 4px 16px rgba(15, 23, 42, 0.06);
      backdrop-filter: blur(16px);
    }

    .logo {
      display: block;
      width: 112px;
      height: 112px;
      margin: 0 auto 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 7vw, 36px);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 30px;
      color: #64748b;
      font-size: 17px;
      line-height: 1.6;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button:active {
      transform: translateY(0);
    }

    .button-danger {
      color: #ffffff;
      background: #dc2626;
      box-shadow: 0 10px 24px rgba(220, 38, 38, 0.25);
    }

    .button-danger:hover {
      background: #b91c1c;
      box-shadow: 0 14px 30px rgba(220, 38, 38, 0.32);
    }

    .button-secondary {
      color: #334155;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
    }

    .button-secondary:hover {
      background: #e2e8f0;
    }

    @media (max-width: 480px) {
      .card {
        padding: 30px 22px;
        border-radius: 24px;
      }

      .buttons {
        grid-template-columns: 1fr;
      }

      .button-danger {
        order: 1;
      }

      .button-secondary {
        order: 2;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <svg
      class="logo"
      width="160"
      height="160"
      viewBox="0 0 160 160"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="Logo Zorix"
    >
      <defs>
        <linearGradient
          id="zorixCore"
          x1="32"
          y1="24"
          x2="130"
          y2="136"
          gradientUnits="userSpaceOnUse"
        >
          <stop offset="0%" stop-color="#2563EB"/>
          <stop offset="45%" stop-color="#06B6D4"/>
          <stop offset="100%" stop-color="#22C55E"/>
        </linearGradient>

        <linearGradient
          id="zorixZ"
          x1="45"
          y1="42"
          x2="115"
          y2="118"
          gradientUnits="userSpaceOnUse"
        >
          <stop offset="0%" stop-color="#FFFFFF"/>
          <stop offset="100%" stop-color="#E0F2FE"/>
        </linearGradient>
      </defs>

      <rect
        x="20"
        y="20"
        width="120"
        height="120"
        rx="34"
        fill="url(#zorixCore)"
      />

      <path
        d="M48 50H112L92 73H108L55 112L76 86H52L72 63H48Z"
        fill="url(#zorixZ)"
      />

      <path
        d="M38 92C52 118 91 128 120 96"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="8"
        stroke-linecap="round"
        opacity="0.35"
      />

      <circle cx="116" cy="42" r="7" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="42" cy="118" r="5" fill="#FFFFFF" opacity="0.65"/>
    </svg>

    <h1>Eliminare l’account?</h1>

    <p>
      Vuoi davvero eliminare il tuo account?
      Questa azione potrebbe essere irreversibile.
    </p>

    <div class="buttons">
      <a
        class="button button-danger"
        href="https://zorix.it/delete-account"
      >
        Sì
      </a>

      <a
        class="button button-secondary"
        href="https://zorix.it"
      >
        No
      </a>
    </div>
  </main>
</body>
</html>
