<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZorixOS 模拟器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="menubar">
    <div class="left"> Zorix</div>
    <div class="center">4:20 PM</div>
    <div class="right">
      <span class="status">🔋 100%</span>
      <span class="status">📶</span>
    </div>
  </div>

  <div id="desktop">
    <img id="wallpaper" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><rect width='100%' height='100%' fill='%231a1a2e'/><circle cx='1200' cy='200' r='300' fill='%23ff6b6b' opacity='0.15'/><circle cx='300' cy='700' r='400' fill='%2300d2ff' opacity='0.07'/></svg>" alt="wallpaper">

    <div class="icons">
      <div class="icon" data-app="finder">
        <div class="icon-image">📁</div>
        <div class="icon-label">Finder</div>
      </div>
      <div class="icon" data-app="settings">
        <div class="icon-image">⚙️</div>
        <div class="icon-label">Settings</div>
      </div>
      <div class="icon" data-app="about">
        <div class="icon-image">🛈</div>
        <div class="icon-label">About Zorix</div>
      </div>
    </div>
  </div>

  <div id="dock">
    <div class="dock-item" data-app="finder">📁</div>
    <div class="dock-item" data-app="settings">⚙️</div>
    <div class="dock-item" data-app="browser">🌐</div>
  </div>

  <!-- Window container -->
  <div id="windows"></div>

  <template id="window-template">
    <div class="window">
      <div class="titlebar">
        <div class="controls">
          <span class="control close" title="Close"></span>
          <span class="control minimize" title="Minimize"></span>
          <span class="control maximize" title="Maximize"></span>
        </div>
        <div class="title">Window</div>
      </div>
      <div class="content">Content</div>
    </div>
  </template>

  <script src="./app.js"></script>
</body>
</html>
